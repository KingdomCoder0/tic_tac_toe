name: Build a Windows MSIX Bundle

on:
  workflow_dispatch:
    inputs:
      store:
        description: "Build for Microsoft Store"
        required: true
        type: boolean
        default: false

      release_tag:
        description: "GitHub Release tag (leave blank to skip release upload)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-msix:
    name: Build ${{ matrix.arch }} MSIX
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-vs2026-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          architecture: x64

      - name: Set up ARM64 Dart SDK
        if: ${{ matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw "Expected an ARM64 runner."
          }

          $flutterCommand = Get-Command flutter
          $flutterRoot = Split-Path `
            (Split-Path $flutterCommand.Source -Parent) -Parent

          Write-Host "Flutter SDK: $flutterRoot"

          Remove-Item `
            "$flutterRoot\bin\cache\engine-dart-sdk.stamp" `
            -Force -ErrorAction SilentlyContinue

          & "$flutterRoot\bin\internal\update_dart_sdk.ps1"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update the Dart SDK."
          }

          $dartVersion = & "$flutterRoot\bin\dart.bat" --version 2>&1
          Write-Host $dartVersion

          if ("$dartVersion" -notmatch 'windows_arm64') {
            throw "Expected an ARM64 Dart SDK."
          }

          & "$flutterRoot\bin\flutter.bat" precache --windows

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter Windows precache failed."
          }

      - name: Verify Flutter installation
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows application
        run: flutter build windows --release

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build/windows/${{ matrix.arch }}/runner/Release/tic_tac_toe.exe"

          if (!(Test-Path $exe)) {
            throw "Expected executable not found: $exe"
          }

      - name: Create MSIX for GitHub distribution
        if: ${{ !inputs.store }}
        shell: pwsh
        run: |
          dart run msix:create `
            --architecture "${{ matrix.arch }}" `
            --output-name "tic_tac_toe-${{ matrix.arch }}" `
            --sign-msix false `
            --install-certificate false

      - name: Create MSIX for Microsoft Store
        if: ${{ inputs.store }}
        shell: pwsh
        run: |
          dart run msix:create `
            --architecture "${{ matrix.arch }}" `
            --output-name "tic_tac_toe-${{ matrix.arch }}" `
            --store `
            --sign-msix false `
            --install-certificate false

      - name: Verify MSIX package
        shell: pwsh
        run: |
          $package = "build/windows/${{ matrix.arch }}/runner/Release/tic_tac_toe-${{ matrix.arch }}.msix"

          if (!(Test-Path $package)) {
            throw "Expected MSIX package not found: $package"
          }

      - name: Upload architecture package
        uses: actions/upload-artifact@v6
        with:
          name: tic-tac-toe-msix-${{ matrix.arch }}
          path: build/windows/${{ matrix.arch }}/runner/Release/tic_tac_toe-${{ matrix.arch }}.msix
          if-no-files-found: error

  bundle:
    name: Create MSIX bundle
    needs: build-msix
    runs-on: windows-latest

    steps:
      - name: Download architecture packages
        uses: actions/download-artifact@v8
        with:
          pattern: tic-tac-toe-msix-*
          path: packages
          merge-multiple: true

      - name: Verify downloaded packages
        shell: pwsh
        run: |
          Get-ChildItem packages -Filter *.msix

          if (!(Test-Path "packages/tic_tac_toe-x64.msix")) {
            throw "The x64 MSIX package is missing."
          }

          if (!(Test-Path "packages/tic_tac_toe-arm64.msix")) {
            throw "The ARM64 MSIX package is missing."
          }

      - name: Find Windows SDK tools
        id: sdk
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"

          $makeAppx = Get-ChildItem $sdkRoot -Filter MakeAppx.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\MakeAppx.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          $signTool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (!$makeAppx) {
            throw "MakeAppx.exe was not found."
          }

          if (!$signTool) {
            throw "SignTool.exe was not found."
          }

          "MAKEAPPX=$($makeAppx.FullName)" >> $env:GITHUB_OUTPUT
          "SIGNTOOL=$($signTool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign GitHub distribution packages
        if: ${{ !inputs.store }}
        shell: pwsh
        run: |
          $publisher = "CN=A3DC862A-65F6-47CB-AD5A-4F816BDE4C0C"

          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $publisher `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -HashAlgorithm SHA256

          $packages = @(
            "packages/tic_tac_toe-x64.msix",
            "packages/tic_tac_toe-arm64.msix"
          )

          foreach ($package in $packages) {
            & "${{ steps.sdk.outputs.SIGNTOOL }}" sign `
              /fd SHA256 /s My /sha1 $cert.Thumbprint $package

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to sign $package"
            }
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Export-Certificate `
            -Cert $cert `
            -FilePath "dist/Tic-Tac-Toe-signing.cer" |
            Out-Null

          "SIGNING_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Create MSIX bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          & "${{ steps.sdk.outputs.MAKEAPPX }}" bundle /v /o `
            /bv 1.1.0.0 `
            /d packages `
            /p "dist/Tic-Tac-Toe-1.1.0.0.msixbundle"

          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx bundle failed."
          }

      - name: Sign GitHub distribution bundle
        if: ${{ !inputs.store }}
        shell: pwsh
        run: |
          & "${{ steps.sdk.outputs.SIGNTOOL }}" sign `
            /fd SHA256 /s My /sha1 $env:SIGNING_THUMBPRINT `
            "dist/Tic-Tac-Toe-1.1.0.0.msixbundle"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to sign the MSIX bundle."
          }

      - name: Upload GitHub distribution bundle artifact
        if: ${{ !inputs.store }}
        uses: actions/upload-artifact@v6
        with:
          name: tic-tac-toe-windows-msixbundle
          path: |
            dist/Tic-Tac-Toe-1.1.0.0.msixbundle
            dist/Tic-Tac-Toe-signing.cer
          if-no-files-found: error

      - name: Upload Microsoft Store bundle artifact
        if: ${{ inputs.store }}
        uses: actions/upload-artifact@v6
        with:
          name: tic-tac-toe-store-msixbundle
          path: dist/Tic-Tac-Toe-1.1.0.0.msixbundle
          if-no-files-found: error

      - name: Publish GitHub distribution to existing release
        if: ${{ inputs.release_tag != '' && !inputs.store }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO"

          if ($LASTEXITCODE -ne 0) {
            throw "Release '$env:RELEASE_TAG' does not exist in $env:GH_REPO. No release was created."
          }

          gh release upload "$env:RELEASE_TAG" `
            "dist/Tic-Tac-Toe-1.1.0.0.msixbundle" `
            "dist/Tic-Tac-Toe-signing.cer" `
            --repo "$env:GH_REPO" `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload the GitHub distribution assets."
          }
