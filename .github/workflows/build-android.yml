name: Build Android

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag (leave blank to build artifacts only)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > android/key.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Rename release files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/tic_tac_toe-android.apk

          cp build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/tic_tac_toe-android.aab

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/tic_tac_toe-android.apk

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/tic_tac_toe-android.apk
            build/app/outputs/bundle/release/tic_tac_toe-android.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach packages to existing GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            build/app/outputs/flutter-apk/tic_tac_toe-android.apk
            build/app/outputs/bundle/release/tic_tac_toe-android.aab
          fail_on_unmatched_files: true

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/upload-keystore.jks"
