name: tic_tac_toe
description: "A Tic-Tac-Toe game built with Flutter."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  window_manager: ^0.5.2
  msix: ^3.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/Icon-192.png
    - assets/icons/Icon-256.png
    - assets/icons/Icon-512.png
    - assets/icons/app_icon.ico

msix_config:
  display_name: Tic-Tac-Toe Classic Game
  publisher_display_name: Patrick O'Connor
  identity_name: PatrickOConnor.Tic-Tac-ToeClassicGame
  publisher: CN=A3DC862A-65F6-47CB-AD5A-4F816BDE4C0C
  msix_version: 1.0.0.0
  logo_path: assets/icons/Icon-512.png
